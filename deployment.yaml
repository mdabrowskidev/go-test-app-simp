apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-test-app
  namespace: dev
  labels:
    team: wiki-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-test-app
  template:
    metadata:
      labels:
        app: go-test-app
        team: wiki-platform
    spec:
      containers:
        - name: go-test-app
          image: artifactory.wikia-inc.com/mdabrowski/go-test-app:10
          ports:
            - containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_DATABASE
            - name: DATABASE_URL
              value: "$(DB_USER):$(DB_PASSWORD)@tcp(mysql-0.mysql:3306)/$(DB_NAME)"
            - name: DATABASE_READ_URL
              value: "$(DB_USER):$(DB_PASSWORD)@tcp(mysql-read:3306)/$(DB_NAME)"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: go-test-app
  namespace: dev
  labels:
    team: wiki-platform
spec:
  selector:
    app: go-test-app
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP