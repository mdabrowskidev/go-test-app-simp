apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: dev
data:
  # quorum by default so the delivery-limit policy applies to queues the app declares
  20-app.conf: |
    default_queue_type = quorum
    load_definitions = /etc/rabbitmq/definitions.json
  # dead-letter exchange and queue for users.create, failed messages land in users.create.dlq
  definitions.json: |
    {
      "exchanges": [
        {"name": "users.dlx", "vhost": "/", "type": "fanout", "durable": true, "auto_delete": false, "internal": false, "arguments": {}}
      ],
      "queues": [
        {"name": "users.create.dlq", "vhost": "/", "durable": true, "auto_delete": false, "arguments": {}}
      ],
      "bindings": [
        {"source": "users.dlx", "vhost": "/", "destination": "users.create.dlq", "destination_type": "queue", "routing_key": "", "arguments": {}}
      ],
      "policies": [
        {"name": "users-dlx", "vhost": "/", "pattern": "^users\\.create$", "apply-to": "queues", "priority": 0,
         "definition": {"dead-letter-exchange": "users.dlx", "delivery-limit": 5}}
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: dev
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      name: amqp
    - port: 15672
      name: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: dev
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-app.conf
              subPath: 20-app.conf
            - name: config
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
